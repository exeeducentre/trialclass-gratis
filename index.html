<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Trial Class Gratis - EXE Education Centre</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            pink: '#d81b60',
                            orange: '#f57c00',
                            yellow: '#fbc02d',
                            dark: '#1f2022',
                            blue: '#2563eb'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        .bg-gradient-brand { background: linear-gradient(135deg, #d81b60 0%, #f57c00 50%, #fbc02d 100%); }
        .text-gradient-brand { background: linear-gradient(135deg, #d81b60 0%, #f57c00 50%, #fbc02d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d81b60; border-radius: 10px; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Datepicker icon styling */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased bg-slate-50 relative min-h-screen flex flex-col selection:bg-brand-pink selection:text-white">

    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-slate-200 transition-all duration-300" id="navbar">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img class="h-8 md:h-10 w-auto" src="https://images2.imgbox.com/ad/c5/3XFVIZZN_o.png" alt="Logo EXE">
                <span class="hidden md:inline-block font-bold text-slate-400 border-l-2 border-slate-200 pl-3 ml-1 text-sm tracking-widest uppercase">Trial Class</span>
            </div>
            <a href="https://wa.me/6285141525668" target="_blank" class="flex items-center gap-2 bg-brand-dark text-white px-4 py-2 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-bold hover:bg-black transition-all border-2 border-transparent hover:border-brand-yellow shadow-md">
                <i class="fab fa-whatsapp text-brand-yellow"></i>
                <span class="hidden sm:inline">Hubungi Admin</span>
                <span class="sm:hidden">Admin</span>
            </a>
        </div>
    </nav>

    <main class="flex-grow pt-24 pb-24 px-4 w-full text-brand-dark flex flex-col items-center">
        <section class="w-full max-w-lg mt-4 md:mt-10">
            
            <div class="text-center mb-8">
                <div class="inline-block bg-pink-100 text-brand-pink px-4 py-1.5 rounded-full text-xs font-bold mb-4 uppercase tracking-widest border border-pink-200">Terbatas!</div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-brand-dark mb-3">Daftar Trial Class</h1>
                <p class="text-slate-500 text-sm md:text-base">Isi data di bawah ini untuk mengatur jadwal kelas percobaan gratis secara eksklusif.</p>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl border border-slate-100 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-brand opacity-10 rounded-bl-[100px] pointer-events-none"></div>
                
                <form id="trial-form" onsubmit="handleFormSubmit(event)" class="space-y-5 relative z-10">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">Nama Lengkap <span class="text-red-500">*</span></label>
                        <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-brand-pink focus:bg-white transition-all">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">No. WhatsApp <span class="text-red-500">*</span></label>
                        <input type="number" id="wa" required placeholder="Contoh: 081234567890" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-brand-pink focus:bg-white transition-all">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">Asal Sekolah <span class="text-red-500">*</span></label>
                            <input type="text" id="sekolah" required placeholder="Contoh: SMAN 1" class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-brand-pink focus:bg-white transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">Kelas <span class="text-red-500">*</span></label>
                            <select id="kelas" required class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-brand-pink focus:bg-white transition-all text-slate-700">
                                <option value="" disabled selected>Pilih Kelas</option>
                                <option value="9 SMP">9 SMP</option>
                                <option value="8 SMP">8 SMP</option>
                                <option value="7 SMP">7 SMP</option>
                                <option value="6 SD">6 SD</option>
                                <option value="5 SD">5 SD</option>
                                <option value="4 SD">4 SD</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">Mata Pelajaran <span class="text-red-500">*</span></label>
                            <select id="mapel" required class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-brand-pink focus:bg-white transition-all text-slate-700">
                                <option value="" disabled selected>Pilih Mapel</option>
                                <option value="Matematika">Matematika</option>
                                <option value="Fisika">Fisika</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 ml-1">Pilih Tanggal <span class="text-red-500">*</span></label>
                            <input type="date" id="tanggal" required class="w-full px-5 py-3.5 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-brand-pink focus:bg-white transition-all text-slate-700">
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-gradient-brand text-white font-bold py-4 rounded-xl hover:shadow-lg hover:-translate-y-1 transition-all mt-4 text-base md:text-lg flex justify-center items-center gap-2 group">
                        <span class="relative z-10 flex items-center">
                            Daftar Jadwal Sekarang 
                            <i class="fas fa-paper-plane ml-2 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                        </span>
                    </button>

                    <div id="success-message" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-xl items-center gap-3 text-green-700 animate-[fadeIn_0.3s_ease-in-out]">
                        <i class="fas fa-check-circle text-2xl"></i>
                        <div>
                            <h4 class="font-bold text-sm">Pendaftaran Berhasil Terkirim!</h4>
                            <p class="text-xs opacity-90">Tim Admin EXE akan segera menghubungimu via WhatsApp untuk konfirmasi jam.</p>
                        </div>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <script>
        // URL DEPLOYMENT GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCOqfHvWi-2cORI1n3jWyepNwnQQEKdJvbMlSvX9G6V3zMuMaeTAlUiT0iR2wbomiH/exec";

        document.addEventListener('DOMContentLoaded', function() {
            // 1. Mencegah user memilih tanggal mundur (set 'min' ke hari ini)
            const dateInput = document.getElementById('tanggal');
            if (dateInput) {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const formattedToday = `${year}-${month}-${day}`;
                
                dateInput.min = formattedToday;
            }
        });

        // 2. Fungsi penanganan saat form di-submit
        function handleFormSubmit(event) {
            event.preventDefault(); // Mencegah halaman reload
            
            const btn = document.getElementById('submit-btn');
            
            // Ubah tombol jadi status memproses
            btn.innerHTML = `<span class="relative z-10 flex items-center"><i class="fas fa-circle-notch fa-spin mr-2"></i> Memproses...</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            // Ambil seluruh data input
            const formData = {
                nama: document.getElementById('nama').value,
                wa: document.getElementById('wa').value,
                sekolah: document.getElementById('sekolah').value,
                kelas: document.getElementById('kelas').value,
                mapel: document.getElementById('mapel').value,
                tanggal: document.getElementById('tanggal').value
            };

            // Mengirim data ke API Apps Script menggunakan action: 'daftarTrial'
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'daftarTrial',
                    data: formData
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    // Sembunyikan form dan tampilkan pesan sukses
                    const successDiv = document.getElementById('success-message');
                    successDiv.classList.remove('hidden');
                    successDiv.classList.add('flex');
                    
                    // Reset tombol
                    btn.innerHTML = `<span class="relative z-10 flex items-center"><i class="fas fa-check mr-2"></i> Selesai</span>`;
                    
                    // Opsional: kosongkan form
                    document.getElementById('trial-form').reset();
                } else {
                    showError(btn);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError(btn);
            });
        }

        // Fungsi kecil untuk handle visual error di tombol
        function showError(btn) {
            btn.innerHTML = `<span class="relative z-10 flex items-center text-yellow-200"><i class="fas fa-exclamation-triangle mr-2"></i> Gagal, Coba Lagi</span>`;
            setTimeout(() => {
                btn.innerHTML = `<span class="relative z-10 flex items-center">Daftar Jadwal Sekarang <i class="fas fa-paper-plane ml-2 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i></span>`;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }, 3000);
        }
    </script>
</body>
</html>
